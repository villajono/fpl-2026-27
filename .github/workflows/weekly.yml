name: Weekly FPL Report

on:
  schedule:
    # Runs DAILY at 07:00 UTC. The job is deadline-aware: it reads the real FPL deadline from
    # the API and only emails ONCE per gameweek, in the ~30h before that deadline — so it never
    # misses a Friday-night or midweek deadline. (Change 7 to a different UTC hour if you like.)
    - cron: "0 7 * * *"
  workflow_dispatch:   # manual trigger — one tap in the GitHub mobile app; always emails (for tests/retries)

permissions:
  contents: write
  issues: write        # the no-secrets notification path (see "Notify via GitHub issue")

concurrency:
  group: weekly-fpl
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Must run BEFORE weekly.py: ev_v2 reads the player CSV at import, so a refresh during the
      # run would not take effect until the next day. Without this the universe stays frozen at the
      # day the file was built — by 2026-08-13 ten players were rated against the wrong club's
      # fixtures and 23 signings were invisible.
      - name: Refresh the player universe from the live FPL API
        working-directory: scripts
        run: python -W ignore refresh_players.py

      - name: Run weekly loop (detect -> ingest -> refresh -> report + deadline)
        working-directory: scripts
        run: |
          # `set -o pipefail` is essential: without it the pipeline returns *tee's* exit status,
          # so a crash inside weekly.py looks like success and a truncated report gets committed
          # and emailed. That is exactly what happened with the best_transfer KeyError.
          set -o pipefail
          PYTHONIOENCODING=utf-8 python -W ignore weekly.py | tee ../report_latest.txt

      - name: Verify the report is complete before emailing it
        run: python scripts/check_report.py report_latest.txt

      - name: Build phone-friendly HTML
        run: python scripts/to_html.py report_latest.txt report.html

      - name: Decide whether to email (deadline-aware, once per GW)
        id: decide
        run: |
          echo "email=$(python -c "import json;print('true' if json.load(open('data/state/deadline.json')).get('should_email') else 'false')")" >> "$GITHUB_OUTPUT"
          python -c "import json;d=json.load(open('data/state/deadline.json'));print('next GW deadline:',d.get('deadline'),'| hours away:',d.get('hours'),'| email now:',d.get('should_email'))"

      - name: Commit updated state + report back to repo
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state report_latest.txt data/raw/players_2026-27.csv || true
          git commit -m "weekly run $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      # Primary notification: needs NO secrets. Gmail SMTP requires an authenticated sender, so the
      # email step below stays dark until MAIL_* are configured. Filing an issue uses the built-in
      # GITHUB_TOKEN, and the @mention notifies the owner by email AND as a push notification in the
      # GitHub mobile app — which works from anywhere, without an App Password.
      - name: Notify via GitHub issue (fallback when email is not configured)
        if: steps.decide.outputs.email == 'true' && env.MAIL_USERNAME == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GW=$(python -c "import json;print(json.load(open('data/state/deadline.json'))['next_gw'])")
          DL=$(python -c "import json;print(json.load(open('data/state/deadline.json'))['deadline'])")
          {
            echo "@${{ github.repository_owner }} — **GW$GW deadline: $DL**"
            echo
            echo "Full report below. Overrides: https://villajono.github.io/fpl-2026-27/form.html"
            echo
            echo '```'
            cat report_latest.txt
            echo '```'
          } > issue_body.md
          gh issue create --title "⚽ FPL GW$GW — deadline $DL" --body-file issue_body.md

      - name: Email the report to your phone
        if: steps.decide.outputs.email == 'true' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: FPL Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚽ FPL — deadline approaching, decisions inside"
          html_body: file://report.html

      # Record the notification ONLY for scheduled runs (not manual/forced), so each GW notifies once
      # but a failed send retries next run, and manual test-runs never suppress the real alert.
      # NB this must NOT require MAIL_USERNAME: the GitHub-issue path is a real notification, and
      # gating on the email step meant nothing was ever recorded, so should_email stayed true for
      # every daily run inside the 30h window -> a duplicate alert per gameweek.
      - name: Record successful scheduled notification
        if: steps.decide.outputs.email == 'true' && env.FORCE_EMAIL != '1' && success()
        run: |
          python -c "import json;d=json.load(open('data/state/deadline.json'));json.dump({'gw':d['next_gw']},open('data/state/last_emailed.json','w'))"
          git add data/state/last_emailed.json
          git commit -m "emailed GW$(python -c "import json;print(json.load(open('data/state/deadline.json'))['next_gw'])")" || true
          git pull --rebase --autostash || true
          git push || true
