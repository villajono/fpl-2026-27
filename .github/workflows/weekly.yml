name: Weekly FPL Report

on:
  schedule:
    # Runs DAILY at 07:00 UTC. The job is deadline-aware: it reads the real FPL deadline from
    # the API and only emails ONCE per gameweek, in the ~30h before that deadline — so it never
    # misses a Friday-night or midweek deadline. (Change 7 to a different UTC hour if you like.)
    - cron: "0 7 * * *"
  workflow_dispatch:   # manual trigger — one tap in the GitHub mobile app; always emails (for tests/retries)

permissions:
  contents: write

concurrency:
  group: weekly-fpl
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly loop (detect -> ingest -> refresh -> report + deadline)
        working-directory: scripts
        run: |
          # `set -o pipefail` is essential: without it the pipeline returns *tee's* exit status,
          # so a crash inside weekly.py looks like success and a truncated report gets committed
          # and emailed. That is exactly what happened with the best_transfer KeyError.
          set -o pipefail
          PYTHONIOENCODING=utf-8 python -W ignore weekly.py | tee ../report_latest.txt

      - name: Verify the report is complete before emailing it
        run: python scripts/check_report.py report_latest.txt

      - name: Build phone-friendly HTML
        run: python scripts/to_html.py report_latest.txt report.html

      - name: Decide whether to email (deadline-aware, once per GW)
        id: decide
        run: |
          echo "email=$(python -c "import json;print('true' if json.load(open('data/state/deadline.json')).get('should_email') else 'false')")" >> "$GITHUB_OUTPUT"
          python -c "import json;d=json.load(open('data/state/deadline.json'));print('next GW deadline:',d.get('deadline'),'| hours away:',d.get('hours'),'| email now:',d.get('should_email'))"

      - name: Commit updated state + report back to repo
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state report_latest.txt || true
          git commit -m "weekly run $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      - name: Email the report to your phone
        if: steps.decide.outputs.email == 'true' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: FPL Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚽ FPL — deadline approaching, decisions inside"
          html_body: file://report.html

      # Record the send ONLY for scheduled emails (not manual/forced), so each GW emails once
      # but a failed send retries next run, and manual test-runs never suppress the real alert.
      - name: Record successful scheduled email
        if: steps.decide.outputs.email == 'true' && env.MAIL_USERNAME != '' && env.FORCE_EMAIL != '1' && success()
        run: |
          python -c "import json;d=json.load(open('data/state/deadline.json'));json.dump({'gw':d['next_gw']},open('data/state/last_emailed.json','w'))"
          git add data/state/last_emailed.json
          git commit -m "emailed GW$(python -c "import json;print(json.load(open('data/state/deadline.json'))['next_gw'])")" || true
          git pull --rebase --autostash || true
          git push || true
